name: Parameterized Manual Workflow

on:
  workflow_dispatch:
    inputs:
      application_name:
        description: 'Name of the application'
        required: true
        type: string
      run_validation:
        description: 'Whether to run validation'
        required: true
        type: boolean

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      validation_status: ${{ steps.set_status.outputs.validation_status }}
    steps:
      - name: Print runtime inputs
        run: |
          echo "application_name: ${{ inputs.application_name }}"
          echo "run_validation: ${{ inputs.run_validation }}"

      - name: Determine validation result
        id: set_status
        run: |
          if [ "${{ inputs.run_validation }}" == "true" ]; then
            echo "validation_status=success" >> "$GITHUB_OUTPUT"
          else
            echo "validation_status=skipped" >> "$GITHUB_OUTPUT"
          fi

  summary:
    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.outputs.validation_status == 'success'
    steps:
      - name: Print final execution summary
        run: |
          echo "==================================="
          echo "Execution Summary"
          echo "==================================="
          echo "Application: ${{ inputs.application_name }}"
          echo "Validation Status: ${{ needs.validate.outputs.validation_status }}"
          echo "Workflow completed successfully."
          echo "==================================="
